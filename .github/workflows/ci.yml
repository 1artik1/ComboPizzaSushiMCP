name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Быстрый smoke (без сети)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Компиляция (синтаксис)
        run: python -m compileall -q combo_mcp scripts

      - name: "Быстрый smoke: сервер + 13 инструментов + JSON-ответы"
        run: python scripts/ci_smoke.py