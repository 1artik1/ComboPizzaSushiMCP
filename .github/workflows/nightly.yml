name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  # Детерминированный гейт: эталоны сверяются с закоммиченными снимками
  # tests/fixtures. Сеть не нужна, результат воспроизводим -> стабильно зелёный.
  gate:
    name: Детерминированный автотест (снимки, без сети)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Компиляция (синтаксис)
        run: python -m compileall -q combo_mcp scripts

      - name: Автотест по снимкам
        run: python scripts/autotest.py --offline

  # Живой мониторинг парсеров: реальные сайты нестабильны (антибот dodo,
  # рейт-лимит ninja, смена разметки anti_sushi). Расхождения — сигнал к
  # разбору, а не повод красить main. Джоба не гейтит (все шаги мягкие).
  monitor:
    name: Живой мониторинг парсеров (не гейт)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Браузер Playwright (фолбэк dodo)
        run: python -m playwright install chromium --with-deps

      - name: Живой парсинг всех сетей (health_check refresh=true)
        run: python -c "from combo_mcp.tools.health_check import health_check; import json; json.loads(health_check(refresh=True))"
        continue-on-error: true

      - name: Живой автотест (отчёт, без гейта)
        run: |
          python scripts/autotest.py > live_report.txt 2>&1 || echo "=== ЖИВОЙ ПРОГОН: есть расхождения (это НЕ гейт) ==="
          tail -n 80 live_report.txt

      - name: Отчёт в summary
        if: always()
        run: |
          {
            echo "## Живой мониторинг парсеров (не гейт)"
            echo ""
            echo '```'
            tail -n 150 live_report.txt 2>/dev/null || echo "нет отчёта"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Загрузка отчёта
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report
          path: |
            live_report.txt
            cache/
          retention-days: 7
